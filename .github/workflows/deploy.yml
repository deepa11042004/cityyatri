name: Deploy to development subdomain

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload changed files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            __MACOSX/**
            storage/**
            includes/db-config.php

      - name: Apply database migrations
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_BASIC_AUTH: ${{ secrets.DEPLOY_BASIC_AUTH }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "DEPLOY_URL / DEPLOY_TOKEN secrets not set - skipping database migrations."
            exit 0
          fi
          AUTH=()
          if [ -n "$DEPLOY_BASIC_AUTH" ]; then AUTH=(-u "$DEPLOY_BASIC_AUTH"); fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -A "Mozilla/5.0 (GitHub Actions deploy)" \
            -X POST -H "X-Deploy-Token: $DEPLOY_TOKEN" "${AUTH[@]}" \
            "${DEPLOY_URL%/}/deploy-migrate.php"
          echo
